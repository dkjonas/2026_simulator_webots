              }
            ]
            endPoint Solid {
              translation 3.320508945065457e-05 -0.00014658784364101558 -0.00023962050996739883
              rotation -0.2096792387461805 -0.9550338286186905 0.2096306347668395 1.6180437269251406
              children [
                Solid {
                  children [
                    Shape {
                      appearance PBRAppearance {
