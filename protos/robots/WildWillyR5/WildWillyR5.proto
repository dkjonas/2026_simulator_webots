                maxVelocity 30
              }
            ]
            endPoint Solid {
              translation 3.320508945065105e-05 -0.00025607266816267117 -0.00011546762888537386
              rotation 0.44171987787335426 0.7807164975702459 -0.4420014704875963 4.466012266972581
              children [
                Solid {
