                }
              ]
              name "wheel_0_tire"
              boundingObject USE wheel_tire
              physics DEF wheel_tire_physics Physics {
              }
            }
          }
        ]
        name "wheel_0_hub"
        boundingObject Cylinder {
          height 0.02
          radius 0.052
        }
        physics DEF wheel_hub_physics Physics {
        }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters {
        position -1.668626528086377e-10
        axis 0 0 -1
        anchor 0.0586 -0.1015 0.02262819049
      }
      device [
        PositionSensor {
          name "swerve_position_angle_1"
        }
